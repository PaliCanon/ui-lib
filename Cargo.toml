[package]
name = "palicanon-ui-lib"
description = "PaliCanon's UI library: the shell, components, theme, languages and motion every service builds on (promoted from ui-lab once validated)."
version = "0.4.9"
edition = "2024"
license = "CC-BY-NC-4.0"
repository = "https://github.com/PaliCanon/ui-lib"
publish = false

[dependencies]
leptos = "0.8"
# Typed string catalogues, generated at build time (build.rs): a missing
# key fails the build. Its own cookie and language detection are off: the
# language is the library's own `language_signal`.
leptos_i18n = { version = "0.6.2", default-features = false }
# Server side: the request's Cookie header (leptos_axum puts the request parts in context).
http = { version = "1", optional = true }
# Browser side: document.cookie.
wasm-bindgen = { version = "0.2", optional = true }
# Awaits the Clipboard API's promise, so CopyField says "Copied" only when it was (080).
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Document", "HtmlDocument", "Window", "Location", "Element", "NodeList", "HtmlElement", "HtmlDivElement", "HtmlImageElement", "HtmlInputElement", "Clipboard", "CssStyleDeclaration", "DomRect", "VisualViewport", "EventTarget", "AddEventListenerOptions", "Storage", "Navigator", "console"] }

[build-dependencies]
# What leptos_i18n_build wraps, used directly: its diagnostics are needed to
# fail the build on a missing key (the wrapper only prints them).
leptos_i18n_parser = "=0.6.2"
leptos_i18n_codegen = "=0.6.2"
# Reads the locale files for the placeholder-parity check (build/placeholders.rs).
serde_json = "1"

[dev-dependencies]
# The native test of focus_trap's glue and Dialog's wiring to it runs
# reactive_graph's real Effect: `effects` on (off under ssr otherwise), on
# a tokio executor. Every other Effect in the library is browser-only
# (#[cfg(feature = "browser")]), so no other SSR test spawns one.
reactive_graph = { version = "0.2", features = ["effects"] }
any_spawner = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["rt"] }
# The placeholder-parity check's own tests (build/placeholders.rs).
serde_json = "1"

# The browser test of hydration behind Cloudflare (tests/hydration.rs, task
# 063), run by wasm-bindgen-test-runner in a headless Chrome; the extra
# web-sys features build the test's documents.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["DomImplementation"] }

[features]
ssr = ["leptos/ssr", "dep:http"]
# The browser-side code (cookies, DOM glue), shared by both client modes.
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
# The browser takes the server's HTML over.
hydrate = ["leptos/hydrate", "browser"]
# The browser builds the page from an empty document (no server).
csr = ["leptos/csr", "browser"]

[lints.rust]
unsafe_code = "forbid"
# Every public item is documented; CI denies warnings, so this is enforced.
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow" # Leptos components take their props by value
