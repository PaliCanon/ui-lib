[package]
name = "map-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "CC-BY-NC-4.0"
repository = "https://github.com/PaliCanon/ui-lib"
description = "A 3D graph renderer for the web (wgpu: WebGPU, WebGL2 fallback): points, links, orbit camera, picking. Knows no corpus."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The canvas; its WebGL2 context, lost when a view is dropped (gpu.rs, `Release`).
web-sys = { version = "0.3", features = [
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebglLoseContext",
  "console",
] }
glam = "0.33"
bytemuck = { version = "1", features = ["derive"] }
map-layout = { version = "0.1.0", path = "../map-layout" }

[lints.rust]
unsafe_code = "forbid"
# Every public item is documented; CI denies warnings, so this is enforced.
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
